
<style>
    .tableinpt {
        width: 100%;
        box-shadow: none;
        border: 0;
        pointer-events: none;
        cursor: pointer;
    }
    /*----------------------------------------------date time css-------------------------------------------------------*/
    .btn-default, .btn-dark-blue {
        border-color: #314559;
        color: #000;
        background-color: white;
    }

        .btn-default.active, .btn-dark-blue.active, .open .dropdown-toggle.btn-default, .open .dropdown-toggle.btn-dark-blue {
            border-color: #2c3e50;
            color: #fff;
            background-color: #2f4254;
        }

    button > span.active {
        color: #ffffff !important;
    }

    .text-info {
        color: #ffffff;
    }

    span {
        color: #000 !important;
    }
    /*--------------------------------------------------*/
    .table-striped > tbody > tr:nth-of-type(odd) {
        background-color: #f9f9f9 !important;
    }
</style>
<div ng-controller="PensionerAllowancesController">
    <div class="breadcrumb-header">
        <!-- breadcrumb Open -->
        <div class="container">
            <section class="content-header">
                <h5>Pensioner Allowances</h5>
                <ol class="breadcrumb">
                    <li><a href="#!/Dashboard"><i class="fa fa-dashboard"> Dashboard</i> </a></li>
                    <li><a href="#!/Dashboard/Pensioners">Pay Roll</a></li>
                    <li><a href="#!/Dashboard/Pensioners/PensionerAllowances">Pensioner Allowances Details</a></li>
                </ol>
            </section>
        </div>
        <!-- breadcrumb Close -->
    </div>
    <div class="container">
        <div class="col-md-12">
            <button class="btn bck_btn"><a href="#!/Dashboard/Pensioners" class="backA"><i class="fa fa-chevron-circle-left" aria-hidden="true"></i>  Back</a></button>
        </div>

    </div>
    <div>
        <div class="container">
            <div class="tab-pane">
                <div class="col-md-12">
                    <div class="alert alert-info">
                        <div class="studWishinputs">
                            <form novalidate="" class="ng-pristine ng-invalid ng-invalid-required">
                                <div class="row">
                                    <div class="form-group col-md-6">
                                        <label>
                                            Pensioner Type:
                                        </label>
                                        <select class="form-control" id="Pensionerid" ng-model="PensionerType" ng-change="ChangePensionerType(PensionerType)" 
                                                ng-options="data.PensionerTypeID as data.PensionerType for data in PensionerTypeData">
                                            <option value="" selected>Select Pensioner Type</option>
                                        </select>

                                    </div>
                                    <div class="col-md-3">
                                        <div class="form-group">
                                            <label class="font-weight-bold">Financial Year:</label>
                                            <div class="">
                                                <select class="form-control" ng-model="FinancialYearID" name="FinancialYear" required>
                                                    <option value="" selected>Select Financial Year</option>
                                                    <option ng-repeat="data in FinancialYears" value="{{data.FinancialYearId}}">
                                                        {{data.FinancialYear}}
                                                    </option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="col-md-3">
                                        <div class="form-group">
                                            <label class="font-weight-bold">Month:</label>
                                            <div class="">
                                                <select class="form-control" ng-model="MonthID" name="Month" ng-change="ChangeMonth(MonthID)" required>
                                                    <option value="" selected>Select Month </option>
                                                    <option ng-repeat="data in AllMonthsData" value="{{data.MonthID}}">
                                                        {{data.Months}}
                                                    </option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>



                                    <div class="form-group col-md-4">
                                        <label>
                                            DR %:
                                        </label>
                                        <input class="form-control" type="text" maxlength="100" oninput="this.value = this.value.replace(/[^0-9.]/g, '').replace(/(\..*)\./g, '$1');" placeholder="Enter DR %" ng-model="DR">
                                    </div>
                                    <div class="form-group col-md-4">
                                        <label>
                                            IR %:
                                        </label>
                                        <input class="form-control" type="text" maxlength="100" oninput="this.value = this.value.replace(/[^0-9.]/g, '').replace(/(\..*)\./g, '$1');" placeholder="Enter IR %" ng-model="IR">
                                    </div>





                                    <div class="col-md-12" style="right:200px">
                                        <div class="form-group text-center">
                                            <button class="btn btn-sm btn-primary  text-center  gr-button btn_top" ng-click="ADDPensionerAllowance()">
                                                ADD
                                                <span class="fa fa-arrow-down heading_icon btn_icons"></span>
                                            </button>
                                        </div>
                                    </div>

                                </div>
                            </form>
                        </div>
                    </div>

                </div>
            </div>

            <td class="">
                <table class="table table-responsive table-bordered" ng-if="PensionerAllowanceData.length>0">
                    <thead>
                        <tr class="cb-1">
                            <th>S.No</th>
                            <th class="text-center">Financial Year</th>
                            <th class="text-center">Month</th>
                            <th class="text-center">Pensioners Type</th>
                            <th class="text-center">DR %</th>
                            <th class="text-center">IR %</th>
                            <th class="text-center">Action</th>
                            <th class="text-center">Active</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr ng-repeat="data in PensionerAllowanceData">
                            <td class="text-center">{{$index + 1}}</td>
                            <td class="text-center pointer">
                                <div>

                                    <select class="form-control tableinpt enabletable{{$index + 1}}" ng-model="data.FinancialYearID" name="FinancialYear"
                                            ng-options="data.FinancialYearId as data.FinancialYear for data in FinancialYears">
                                        <option value="" selected>Select Financial Year</option>
                                    </select>

                                </div>
                            </td>
                            <td class="text-center pointer">
                                <div>
                                    <select class="form-control tableinpt enabletable{{$index + 1}}" id="monthid" ng-model="data.MonthID"
                                            ng-options="data.MonthID as data.Months for data in AllMonthsData">
                                        <option value="" selected>Select Month</option>
                                    </select>

                                </div>
                            </td>
                            <!--<td class="text-center pointer">
                                <div>
                                    <select class="form-control tableinpt enabletable{{$index + 1}}" id="Pensionerid" ng-model="data.PensionerTypeID" disabled
                                            ng-options="data.PensionerTypeID as data.PensionerType for data in PensionerTypeData">
                                        <option value="" selected>Select Pensioner Type</option>
                                    </select>

                                </div>
                            </td>-->
                            <td class="text-center pointer"><div><input type="text" class="form-control tableinpt enabletable{{$index + 1}}" ng-model="data.PensionerType" disabled /></div></td>

                            <td class="text-center pointer"><div><input type="text" class="form-control tableinpt enabletable{{$index + 1}}" ng-model="data.DR" /></div></td>
                            <td class="text-center pointer"><div><input type="text" class="form-control tableinpt enabletable{{$index + 1}}" ng-model="data.IR" /></div></td>


                            <td class="text-center">
                                <button class="btn-xs btn btn-info" style="width: 70px;" ng-show="edit{{$index + 1}}" ng-click="EditAllowance(data,$index+1)">
                                    Edit
                                </button>
                                <button class="btn-xs btn btn-primary" style="width: 70px;" ng-show="!edit{{$index + 1}}" ng-click="UpdateAllowance(data,$index+1)">
                                    Update
                                </button>

                            </td>
                            <td style="text-align:center">
                                <button class="btn-xs btn btn-success" title="Click here to Inactive" ng-click="ChangePensionerAllowance(data.PensionerAllowanceID,0)" ng-if="data.Active==1">Active</button>
                                <button class="btn-xs btn btn-danger" title="Click here to Active" ng-click="ChangePensionerAllowance(data.PensionerAllowanceID,1)" ng-if="data.Active==0">InActive</button>
                            </td>

                        </tr>

                    </tbody>
                </table>
            </td>
        </div>
    </div>
    <div class="spacer"></div>


</div>
<div class="sm-spacer"></div>
<div class="sm-spacer"></div>
</div>
